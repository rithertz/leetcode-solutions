name: daily solution sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        run: pip install requests python-dotenv

      - name: load state from data branch
        run: |
          git fetch origin _data
          git checkout origin/_data -- state.json
          echo "state.json loaded."

      - name: restore scripts cache
        id: scripts-cache
        uses: actions/cache@v4
        with:
          path: scripts/
          key: leetcode-scripts-${{ github.run_id }}
          restore-keys: |
            leetcode-scripts-

      - name: seed scripts if cache miss
        if: steps.scripts-cache.outputs.cache-hit != 'true'
        env:
          SCRIPTS_BUNDLE: ${{ secrets.SCRIPTS_BUNDLE }}
        run: |
          mkdir -p scripts
          echo "$SCRIPTS_BUNDLE" | base64 -d | tar -xz -C scripts/
          echo "scripts/ seeded."

      - name: run daily sync
        env:
          LEETCODE_SESSION:    ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME:   rithertz
        run: python scripts/orchestrator.py

      - name: save state to data branch
        run: |
          git config user.name  "${{ secrets.GIT_AUTHOR_NAME }}"
          git config user.email "${{ secrets.GIT_AUTHOR_EMAIL }}"
          cp state.json /tmp/state.json
          git fetch origin _data
          git checkout _data
          cp /tmp/state.json state.json
          git add state.json
          git diff --cached --quiet && echo "state unchanged" || git commit -m "state update"
          git push origin _data
          git checkout main

      - name: commit solution to main
        env:
          GIT_AUTHOR_NAME:  ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name  "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add Easy/ Medium/ Hard/ README.md 2>/dev/null || true
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "$(python -c "
          import json
          with open('state.json') as f:
              s = json.load(f)
          last = s['synced'][-1]
          print(f\"add {last['title'].lower().replace(' ', '-')} solution\")
          ")"
          git push origin main